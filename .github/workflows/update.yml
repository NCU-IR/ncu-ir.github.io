name: 每日更新點閱數與發佈日

on:
  schedule:
    - cron: '0 18 * * *'   # 台灣時間每天 02:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - name: 有變動才存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.js data.js
          git diff --cached --quiet || git commit -m "每日更新點閱數與發佈日"
          git push
